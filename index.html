<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>练习 · Chinese Practice</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:#F7F1EA;font-family:'DM Sans',sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font-family:'DM Sans',sans-serif;cursor:pointer}
h1,h2{font-family:'Playfair Display',serif}
#app{max-width:520px;margin:0 auto;padding:0 0 60px}

/* home */
.hero{padding:44px 20px 28px;text-align:center}
.hero-icon{font-size:48px;margin-bottom:8px}
.hero h1{font-size:48px;color:#C0302A;line-height:1}
.hero p{color:#9A8578;font-size:15px;margin-top:4px;font-weight:300}
.hero small{color:#C4BAB3;font-size:13px}
.slabel{font-size:11px;font-weight:600;color:#9A8578;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;padding:0 20px}
.pills{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 24px}
.pill{padding:9px 15px;border-radius:100px;border:2px solid #E2D9CE;background:#FFFDF9;color:#7A6558;font-size:13px;font-weight:500;transition:all .17s}
.pill.active{border-color:#C0302A;background:#C0302A;color:#fff}
.modes{display:flex;gap:10px;padding:0 20px 24px}
.mode{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:16px 8px;border-radius:18px;border:2px solid #E2D9CE;background:#FFFDF9;transition:all .18s}
.mode:hover{border-color:#C0302A;transform:translateY(-3px);box-shadow:0 8px 24px rgba(192,48,42,.12)}
.mode .ico{font-size:28px}
.mode .lbl{font-size:13px;font-weight:700;color:#2D1F14}
.mode .sub{font-size:11px;color:#9A8578;text-align:center;line-height:1.3}
.tipbox{margin:0 20px;background:linear-gradient(135deg,#C0302A,#E05040);border-radius:18px;padding:16px 18px;color:#fff}
.tipbox .th{font-size:10px;font-weight:700;letter-spacing:.1em;opacity:.75;margin-bottom:6px}
.tipbox p{font-size:13px;line-height:1.55;font-weight:300}

/* shared */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 6px}
.back{background:none;border:none;color:#9A8578;font-size:14px;font-weight:500}
.back:hover{color:#C0302A}
.tm{font-size:14px;color:#9A8578;font-weight:500}
.tr{font-size:13px;color:#C4BAB3}
.pbar{height:4px;background:#E2D9CE;border-radius:2px;margin:0 20px 22px}
.pbar-fill{height:100%;background:#C0302A;border-radius:2px;transition:width .3s ease}

/* flashcard */
.card-scene{padding:0 20px;margin-bottom:14px}
.card-wrap{perspective:1400px;cursor:pointer;height:260px}
.card-inner{width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1);position:relative}
.card-inner.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.cf{background:#FFFDF9;border:2px solid #E2D9CE;box-shadow:0 8px 32px rgba(160,120,90,.1)}
.cb{background:linear-gradient(135deg,#FFF8F5,#FFF0EC);border:2px solid #F0C8C0;transform:rotateY(180deg)}
.clbl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px}
.cf .clbl{color:#C4BAB3}
.cb .clbl{color:#E09090}
.ceng{font-family:'Playfair Display',serif;font-size:26px;color:#2D1F14;line-height:1.3}
.chint{font-size:12px;color:#C8C0BC;margin-top:16px}
.cpin{font-family:'Playfair Display',serif;font-size:38px;color:#C0302A;margin-bottom:10px}
.ctip{background:rgba(192,48,42,.07);border-radius:10px;padding:9px 12px;font-size:12px;color:#7A4540;line-height:1.5}
.card-nav{display:flex;gap:8px;justify-content:center;padding:0 20px;margin-bottom:12px}
.nbtn{padding:9px 18px;border-radius:100px;border:2px solid #E2D9CE;background:transparent;color:#5A4A40;font-size:13px;font-weight:600;transition:all .17s}
.nbtn:hover:not([disabled]){border-color:#C0302A;color:#C0302A}
.nbtn[disabled]{opacity:.25;cursor:default}
.nbtn.acc{border-color:#C0302A;color:#C0302A}
.know-area{text-align:center;padding:0 20px;animation:fu .25s ease}
.know-area p{font-size:13px;color:#9A8578;margin-bottom:8px}
.know-row{display:flex;gap:8px;justify-content:center}
.kno{padding:9px 22px;border-radius:100px;border:2px solid #F5CECE;background:#FEE2E2;color:#B91C1C;font-size:13px;font-weight:600}
.kye{padding:9px 22px;border-radius:100px;border:2px solid #C6E9D5;background:#DCFCE7;color:#15803D;font-size:13px;font-weight:600}

/* quiz */
.quiz-q{background:#FFFDF9;border-radius:22px;border:2px solid #E2D9CE;padding:26px 22px;margin:0 20px 18px;text-align:center;box-shadow:0 8px 28px rgba(160,120,90,.09)}
.ql{font-size:10px;font-weight:700;color:#C4BAB3;letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}
.qp{font-family:'Playfair Display',serif;font-size:40px;color:#C0302A;line-height:1}
.qp.shake{animation:sk .28s ease}
.opts{display:flex;flex-direction:column;gap:9px;padding:0 20px}
.opt{width:100%;padding:13px 16px;border-radius:13px;border:2.5px solid #E2D9CE;background:#FFFDF9;color:#2D1F14;font-size:14px;font-weight:500;text-align:left;transition:all .17s;line-height:1.4}
.opt:hover:not([disabled]){border-color:#C0302A;color:#C0302A;transform:translateY(-2px)}
.opt.correct{border-color:#16A34A!important;background:#DCFCE7!important;color:#15803D!important;transform:none!important}
.opt.wrong{border-color:#DC2626!important;background:#FEE2E2!important;color:#B91C1C!important;transform:none!important}
.opt.dim{opacity:.3}
.opt[disabled]{cursor:default}
.qtip{background:rgba(192,48,42,.06);border-radius:12px;padding:11px 15px;margin:12px 20px 0;font-size:12px;color:#7A4540;line-height:1.5;animation:fu .25s ease}
.sbadge{font-size:14px;color:#16A34A;font-weight:700}

/* sentences */
.sent-hint{font-size:13px;color:#9A8578;text-align:center;padding:4px 20px 14px}
.sent-list{display:flex;flex-direction:column;gap:10px;padding:0 20px}
.sc{background:#FFFDF9;border-radius:14px;border:2px solid #E2D9CE;padding:16px 18px;cursor:pointer;transition:all .18s}
.sc:hover{border-color:#C0302A;transform:translateY(-2px)}
.sp{font-family:'Playfair Display',serif;font-size:19px;color:#C0302A;line-height:1.3}
.se{font-size:14px;color:#5A4A40;line-height:1.5;margin-top:8px;animation:fu .22s ease}
.st{font-size:12px;color:#C8BDB8;font-style:italic;margin-top:6px}

/* end */
.end{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,#F7F1EA,#EDE3D8)}
.end-box{text-align:center;animation:fu .3s ease;width:100%;max-width:300px}
.end-ico{font-size:64px;margin-bottom:12px}
.end-sc{font-family:'Playfair Display',serif;font-size:36px;color:#C0302A;margin-bottom:4px}
.end-p{font-size:16px;font-weight:600;color:#2D1F14;margin-bottom:6px}
.end-m{font-size:14px;color:#7A6558;margin-bottom:24px}
.btnp{display:block;width:100%;padding:14px;border-radius:100px;border:none;background:#C0302A;color:#fff;font-size:15px;font-weight:600;margin-bottom:10px;box-shadow:0 4px 16px rgba(192,48,42,.25);transition:all .17s}
.btnp:hover{background:#A52520;transform:translateY(-2px)}
.btng{display:block;width:100%;padding:12px;border-radius:100px;border:2px solid #E2D9CE;background:transparent;color:#7A6558;font-size:14px;font-weight:500;transition:all .17s}
.btng:hover{border-color:#C0302A;color:#C0302A}
.cdot{display:inline-block;width:13px;height:13px;border-radius:50%;vertical-align:middle;margin-right:4px;border:1px solid rgba(0,0,0,.1)}

@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes sk{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:#D4C5BA;border-radius:3px}
</style>
</head>

};

function shuffle(a){ return [].concat(a).sort(function(){ return Math.random()-.5; }); }
function gv(t){ if(t==='all'){ var r=[]; Object.keys(VOCAB).forEach(function(k){ r=r.concat(VOCAB[k]); }); return r; } return VOCAB[t]||[]; }
function gs(t){ if(t==='all'){ var r=[]; Object.keys(SENTS).forEach(function(k){ r=r.concat(SENTS[k]); }); return r; } return SENTS[t]||[]; }
function totalW(){ return gv('all').length; }
function buildOpts(q, all){
  var wrong = shuffle(all.filter(function(v){ return v.e !== q.e; })).slice(0,3);
  return shuffle([q].concat(wrong));
}

// ── MAIN RENDER + BIND ────────────────────────────────────────────────
function render() {
  var app = document.getElementById('app');
  if (S.screen === 'home')      { app.innerHTML = rHome();      bHome();      return; }
  if (S.screen === 'flashcard') { app.innerHTML = rFlash();     bFlash();     return; }
  if (S.screen === 'quiz')      { app.innerHTML = rQuiz();      bQuiz();      return; }
  if (S.screen === 'sentences') { app.innerHTML = rSents();     bSents();     return; }
}

// ── START ─────────────────────────────────────────────────────────────
function startMode(m) {
  var raw = gv(S.topic);
  S.vocab = shuffle(raw);
  S.sents = gs(S.topic);
  S.ci = 0; S.cf = false; S.kn = 0; S.done = false;
  S.qs = shuffle(raw).slice(0, Math.min(raw.length, 15));
  S.qi = 0; S.qsc = 0; S.qsel = null; S.sr = {};
  if (S.qs.length > 0) S.qopts = buildOpts(S.qs[0], raw);
  S.screen = m;
  render();
}

// ── HOME ──────────────────────────────────────────────────────────────
function rHome() {
  var topicKeys = Object.keys(TOPICS);
  var pills = '<button class="pill' + (S.topic==='all'?' active':'') + '" data-t="all">✨ All</button>';
  topicKeys.forEach(function(k){
    pills += '<button class="pill' + (S.topic===k?' active':'') + '" data-t="'+k+'">'+TOPICS[k]+'</button>';
  });
  return '<div>' +
    '<div class="hero"><div class="hero-icon">🈯</div><h1>练习</h1><p>Liànxí · Chinese Practice</p>' +
    '<small>Lessons 3–5 + Places, Food &amp; Colours · '+totalW()+' words</small></div>' +
    '<p class="slabel">Choose a topic</p><div class="pills">'+pills+'</div>' +
    '<p class="slabel">Choose a mode</p>' +
    '<div class="modes">' +
    '<button class="mode" id="mf"><span class="ico">🃏</span><span class="lbl">Flashcards</span><span class="sub">Flip to reveal pīnyīn</span></button>' +
    '<button class="mode" id="mq"><span class="ico">🧠</span><span class="lbl">Quiz</span><span class="sub">Multiple choice</span></button>' +
    '<button class="mode" id="ms"><span class="ico">💬</span><span class="lbl">Sentences</span><span class="sub">Key phrases</span></button>' +
    '</div>' +
    '<div class="tipbox"><div class="th">💡 QUICK TIP</div>' +
    '<p>Tones change meaning completely! Mā (mum), má (hemp), mǎ (horse), mà (scold). Say each tone mark out loud.</p></div></div>';
}
function bHome() {
  document.querySelectorAll('.pill').forEach(function(b){
    b.addEventListener('click', function(){ S.topic = b.dataset.t; render(); });
  });
  document.getElementById('mf').addEventListener('click', function(){ startMode('flashcard'); });
  document.getElementById('mq').addEventListener('click', function(){ startMode('quiz'); });
  document.getElementById('ms').addEventListener('click', function(){ startMode('sentences'); });
}

// ── FLASHCARD ─────────────────────────────────────────────────────────
function rFlash() {
  if (S.done) return rEnd();
  var tot = S.vocab.length;
  var c = S.vocab[S.ci];
  var pct = ((S.ci+1)/tot)*100;
  var dotHtml = (c.dot !== undefined) ? '<span class="cdot" style="background:'+( c.dot||'transparent')+'"></span>' : '';
  var knowHtml = S.cf ?
    '<div class="know-area"><p>Did you know it?</p><div class="know-row">' +
    '<button class="kno" id="kno">😅 Not yet</button>' +
    '<button class="kye" id="kye">✓ Got it!</button>' +
    '</div></div>' : '';
  return '<div>' +
    '<div class="topbar"><button class="back" id="gh">← Menu</button>' +
    '<span class="tm">'+(S.ci+1)+' / '+tot+'</span>' +
    '<span class="tr">🃏 Flashcards</span></div>' +
    '<div class="pbar"><div class="pbar-fill" style="width:'+pct+'%"></div></div>' +
    '<div class="card-scene"><div class="card-wrap" id="cw">' +
    '<div class="card-inner'+(S.cf?' flipped':'')+'">' +
    '<div class="card-face cf"><div class="clbl">English</div>' +
    '<div class="ceng">'+c.e+'</div><div class="chint">tap to reveal pīnyīn 👆</div></div>' +
    '<div class="card-face cb"><div class="clbl">Pīnyīn</div>' +
    '<div class="cpin">'+dotHtml+c.p+'</div>' +
    (c.t ? '<div class="ctip">💡 '+c.t+'</div>' : '') +
    '</div></div></div></div>' +
    '<div class="card-nav">' +
    '<button class="nbtn" id="pb" '+(S.ci===0?'disabled':'')+'>← Prev</button>' +
    '<button class="nbtn acc" id="fb">'+(S.cf?'🔄 Flip back':'🔄 Flip')+'</button>' +
    '<button class="nbtn" id="nb">'+(S.ci<tot-1?'Next →':'Finish ✓')+'</button>' +
    '</div>' + knowHtml + '</div>';
}
function bFlash() {
  if (S.done) { bEnd(); return; }
  document.getElementById('gh').addEventListener('click', function(){ S.screen='home'; render(); });
  document.getElementById('cw').addEventListener('click', function(){ S.cf=!S.cf; render(); });
  document.getElementById('fb').addEventListener('click', function(e){ e.stopPropagation(); S.cf=!S.cf; render(); });
  document.getElementById('pb').addEventListener('click', function(){ if(S.ci>0){ S.cf=false; S.ci--; render(); } });
  document.getElementById('nb').addEventListener('click', function(){ advF(false); });
  var kno = document.getElementById('kno');
  var kye = document.getElementById('kye');
  if (kno) kno.addEventListener('click', function(){ advF(false); });
  if (kye) kye.addEventListener('click', function(){ advF(true); });
}
function advF(knew) {
  if (knew) S.kn++;
  if (S.ci < S.vocab.length-1) { S.cf=false; S.ci++; render(); }
  else { S.done=true; render(); }
}

// ── QUIZ ──────────────────────────────────────────────────────────────
function rQuiz() {
  if (S.done) return rEnd();
  var q = S.qs[S.qi];
  var tot = S.qs.length;
  var pct = ((S.qi+1)/tot)*100;
  var sel = S.qsel;
  var dotHtml = (q.dot !== undefined) ? '<span class="cdot" style="background:'+(q.dot||'transparent')+'"></span>' : '';
  var optsHtml = S.qopts.map(function(o, idx){
    var cls = 'opt';
    if (sel !== null) {
      if (o.e === q.e) cls += ' correct';
      else if (o.e === sel) cls += ' wrong';
      else cls += ' dim';
    }
    return '<button class="'+cls+'" data-idx="'+idx+'" '+(sel!==null?'disabled':'')+'>'+o.e+'</button>';
  }).join('');
  return '<div>' +
    '<div class="topbar"><button class="back" id="gh">← Menu</button>' +
    '<span class="tm">'+(S.qi+1)+' / '+tot+'</span>' +
    '<span class="sbadge">✓ '+S.qsc+'</span></div>' +
    '<div class="pbar"><div class="pbar-fill" style="width:'+pct+'%"></div></div>' +
    '<div class="quiz-q"><div class="ql">What does this mean?</div>' +
    '<div class="qp'+(sel!==null && sel!==q.e?' shake':'')+'">' + dotHtml + q.p + '</div></div>' +
    '<div class="opts">'+optsHtml+'</div>' +
    (sel!==null && q.t ? '<div class="qtip">💡 '+q.t+'</div>' : '') +
    '</div>';
}
function bQuiz() {
  if (S.done) { bEnd(); return; }
  var q = S.qs[S.qi];
  document.getElementById('gh').addEventListener('click', function(){ S.screen='home'; render(); });
  document.querySelectorAll('.opts .opt').forEach(function(b){
    b.addEventListener('click', function(){
      if (S.qsel !== null) return;
      var idx = parseInt(b.dataset.idx, 10);
      S.qsel = S.qopts[idx].e;
      if (S.qsel === q.e) S.qsc++;
      render();
      setTimeout(function(){
        var raw = gv(S.topic);
        if (S.qi < S.qs.length-1) {
          S.qi++;
          S.qsel = null;
          S.qopts = buildOpts(S.qs[S.qi], raw);
          render();
        } else {
          S.done = true;
          render();
        }
      }, 1300);
    });
  });
}

// ── SENTENCES ─────────────────────────────────────────────────────────
function rSents() {
  var rows = S.sents.map(function(s, i){
    return '<div class="sc" data-i="'+i+'">' +
      '<div class="sp">'+s.p+'</div>' +
      (S.sr[i] ? '<div class="se">'+s.e+'</div>' : '<div class="st">tap to reveal...</div>') +
      '</div>';
  }).join('');
  return '<div>' +
    '<div class="topbar"><button class="back" id="gh">← Menu</button>' +
    '<span class="tm">'+S.sents.length+' sentences</span>' +
    '<span class="tr">💬 Phrases</span></div>' +
    '<p class="sent-hint">Tap to reveal the English meaning 👇</p>' +
    '<div class="sent-list">'+rows+'</div></div>';
}
function bSents() {
  document.getElementById('gh').addEventListener('click', function(){ S.screen='home'; render(); });
  document.querySelectorAll('.sc').forEach(function(c){
    c.addEventListener('click', function(){ var i=parseInt(c.dataset.i,10); S.sr[i]=!S.sr[i]; render(); });
  });
}

// ── END SCREEN ────────────────────────────────────────────────────────
function rEnd() {
  var mode = S.screen;
  var icon, l1, l2, msg;
  if (mode === 'flashcard') {
    var tot = S.vocab.length;
    icon = S.kn>=tot*.8 ? '🌟' : S.kn>=tot*.5 ? '👍' : '💪';
    l1 = tot + ' cards reviewed';
    l2 = '✓ ' + S.kn + ' felt familiar';
    msg = S.kn>=tot*.8 ? 'Excellent! 很好！' : S.kn>=tot*.5 ? 'Good going! 不错！' : 'Keep practising! 加油！';
  } else {
    var pct = Math.round(S.qsc/S.qs.length*100);
    icon = pct>=80 ? '🌟' : pct>=60 ? '👍' : '💪';
    l1 = S.qsc + ' / ' + S.qs.length + ' correct';
    l2 = pct + '%';
    msg = pct>=80 ? 'Excellent! 很好！' : pct>=60 ? 'Good effort! 不错！' : 'Keep going! 加油！';
  }
  return '<div class="end"><div class="end-box">' +
    '<div class="end-ico">'+icon+'</div>' +
    '<div class="end-sc">'+l1+'</div>' +
    '<div class="end-p">'+l2+'</div>' +
    '<div class="end-m">'+msg+'</div>' +
    '<button class="btnp" id="retry">🔄 Go again</button>' +
    '<button class="btng" id="ehome">← Back to menu</button>' +
    '</div></div>';
}
function bEnd() {
  var mode = S.screen;
  document.getElementById('retry').addEventListener('click', function(){ startMode(mode); });
  document.getElementById('ehome').addEventListener('click', function(){ S.screen='home'; render(); });
}

// ── INIT ──────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
